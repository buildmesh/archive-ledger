[package]
name = "archive-ledger"
version = "0.1.0"
edition = "2021"
description = "Local-first preservation inventory and disaster-risk ledger"

[lib]
name = "archive_ledger"
path = "src/lib.rs"

[dependencies]
blake3 = "1"
fs2 = "0.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = "1"

[dev-dependencies]
tempfile = "3"

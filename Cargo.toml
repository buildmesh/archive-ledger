[package]
name = "archive-ledger"
version = "0.1.0"
edition = "2021"
description = "Local-first preservation inventory and disaster-risk ledger"

[lib]
name = "archive_ledger"
path = "src/lib.rs"

[dependencies]
blake3 = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
fs2 = "0.4"
getrandom = "0.3"
libc = "0.2"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ulid = "1"

[[bin]]
name = "archive"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
